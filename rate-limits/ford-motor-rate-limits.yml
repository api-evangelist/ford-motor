specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Ford Motor Company
providerId: ford-motor
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Automobiles
  - Connected Vehicle
  - Rate Limiting
description: Ford Motor Company does not publish numeric rate limits for its developer/partner APIs. Throttling is governed by partnership agreements and per-VIN polling minimums to protect vehicle hardware.
notes: No public RPS/RPM documentation. Mirror of ford rate-limits.
sources:
  - https://developer.ford.com/
  - https://developer.ford.com/apis
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Per-partner API throttle
    scope: partner/api-key
    metric: varies
    limit: per-partner agreement; not publicly published
    applies:
      - Ford Connected Vehicle API
      - Ford FordPass API
      - Ford Dealer / Fleet API
  - name: Per-vehicle telemetry poll minimum
    scope: vehicle
    metric: minimum_poll_interval
    limit: enforced per endpoint to protect TCU/modem; not publicly published
    applies:
      - Ford Connected Vehicle Telemetry
policies:
  - name: Backoff Strategy
    description: Clients should implement exponential backoff with jitter on 429/5xx responses; honor Retry-After when present.
  - name: Vehicle-Touch Throttling
    description: Endpoints that wake or query the vehicle TCU enforce minimum poll intervals; subscribe to webhooks/streaming where available.
  - name: Customer Consent
    description: Per-VIN access requires owner consent on FordPass; revoking consent terminates partner access for that VIN.
maintainers: []
