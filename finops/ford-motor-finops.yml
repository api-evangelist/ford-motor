principles:
  - name: Visibility
    description: Pull partner-portal usage daily and reconcile against your own logs; track per-VIN consent status to avoid billing for orphaned subscriptions.
  - name: Allocation
    description: Tag every request with end-customer, VIN, and use-case for chargeback to downstream product features.
  - name: Optimization
    description: Use webhooks/streaming over polling; respect minimum poll intervals; cache static reference data; archive historical data into your own warehouse rather than re-fetching.
  - name: Accountability
    description: Connected-vehicle product owner owns the partnership agreement; finance audits VIN subscription counts against active consent monthly.
